<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mini Quant Lab</title>
  <desc id="desc">Abstract chart themed banner for Mini Quant Lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#13243E"/>
    </linearGradient>
    <linearGradient id="line" x1="40" y1="560" x2="1160" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>

  <g opacity="0.24" stroke="#355070" stroke-width="1">
    <line x1="0" y1="96" x2="1200" y2="96"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="0" y1="384" x2="1200" y2="384"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="576" x2="1200" y2="576"/>
    <line x1="120" y1="0" x2="120" y2="675"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="360" y1="0" x2="360" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="840" y1="0" x2="840" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
    <line x1="1080" y1="0" x2="1080" y2="675"/>
  </g>

  <polyline
    points="70,520 190,470 300,500 410,430 520,395 640,420 760,335 870,300 980,250 1130,180"
    fill="none"
    stroke="url(#line)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <g fill="#9CC8FF">
    <circle cx="190" cy="470" r="8"/>
    <circle cx="410" cy="430" r="8"/>
    <circle cx="760" cy="335" r="8"/>
    <circle cx="980" cy="250" r="8"/>
    <circle cx="1130" cy="180" r="8"/>
  </g>

  <rect x="70" y="68" width="286" height="44" rx="22" fill="#1E3A8A" fill-opacity="0.55"/>
  <text x="96" y="97" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="22" font-weight="700">Cloud + Quant Demo</text>

  <text x="70" y="605" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="56" font-weight="700">Mini Quant Lab</text>
  <text x="70" y="640" fill="#C7D2FE" font-family="Arial, sans-serif" font-size="24" font-weight="500">NumPy, Pandas, backtesting, and interactive strategy controls</text>
</svg>
